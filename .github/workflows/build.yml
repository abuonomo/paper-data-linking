name: build-images

# Builds the api and client images and pushes them to the GitHub Container
# Registry (GHCR) under this repo's owner. Deployment is separate: the prod
# host pulls these images (see docs/DEPLOYMENT.md). Account-agnostic — works
# under whichever account/org owns the repo.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One image build at a time. Every run pushes :latest, so when two merges land
# close together an older build can finish last and overwrite :latest with the
# older commit (seen on 2026-09-24: #30's build finished after #31's and prod ran
# the client without #31's nginx changes). A newer push cancels the older run;
# the newest commit always contains the older one's changes.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository_owner }}/paper-data-linking

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR
    strategy:
      matrix:
        include:
          - name: api
            context: .
            dockerfile: Dockerfile
            build-args: |
              GIT_SHA=${{ github.sha }}
          - name: client
            context: ./client
            dockerfile: ./client/Dockerfile
            build-args: |
              BUILD_MODE=production
              VITE_BASE_URL=${{ vars.VITE_BASE_URL }}
              VITE_BASE_PROTOCOL=${{ vars.VITE_BASE_PROTOCOL }}
              VITE_CONTACT_EMAIL=${{ vars.VITE_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3   # docker-container driver (needed for gha cache)

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
