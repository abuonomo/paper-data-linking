name: build-images

# Builds the api and client images and pushes them to the GitHub Container
# Registry (GHCR) under this repo's owner. Deployment is separate: the prod
# host pulls these images (see docs/DEPLOYMENT.md). Account-agnostic — works
# under whichever account/org owns the repo.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository_owner }}/paper-data-linking

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR
    strategy:
      matrix:
        include:
          - name: api
            context: .
            dockerfile: Dockerfile
            build-args: ""
          - name: client
            context: ./client
            dockerfile: ./client/Dockerfile
            build-args: |
              BUILD_MODE=production
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
