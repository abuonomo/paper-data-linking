name: build-runner-image

# Builds the standalone batch runner image (vLLM + the paper pipeline, see
# runner/README.md) and pushes it to GHCR. Kept out of build-images.yml on purpose:
# that workflow's images are what production pulls, and this image sits on a
# multi-gigabyte vLLM base that must never slow down or fail a deploy.

on:
  push:
    branches: [main]
    paths:
      - "paper_data_linking/**"
      - "runner/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-runner.yml"
  workflow_dispatch: {}

concurrency:
  group: build-runner-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/paper-data-linking/runner

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The vLLM base image needs more disk than a hosted runner has free by default.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: runner/Dockerfile
          platforms: linux/amd64
          build-args: |
            GIT_SHA=${{ github.sha }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
