# Builds the JOSS paper (paper/paper.md) into a PDF on every change to it,
# using the same toolchain JOSS uses, so the reviewer-facing PDF is always available
# as a workflow artifact.
name: JOSS paper
on:
  push:
    paths: ['paper/**']
  pull_request:
    paths: ['paper/**']
  workflow_dispatch:
jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md
      - uses: actions/upload-artifact@v4
        with:
          name: joss-paper
          path: paper/paper.pdf
