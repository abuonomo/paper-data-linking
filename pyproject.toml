[project]
name = "paper-data-linking"
version = "0.1.0"
description = "Identify and extract data references in heliophysics research papers. Starting with papers which use SOHO instrument data."
authors = [
    { name = "Anthony Buonomo", email = "anthony.r.buonomo@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    "pyproject-hooks==1.1.0",
    "numpy>=1.24.2",
    "python-dotenv>=0.21.1",
    "tqdm>=4.64.1",
    "pytest>=7.2.2",
    "pymupdf>=1.24.8",
    "pytesseract>=0.3.10",
    "pdf2image>=1.16.3",
    "tiktoken>=0.8.0",
    "openai>=1.35.14,<1.100.0",
    "fastapi==0.115.5",
    "uvicorn==0.22.0",
    "python-multipart==0.0.18",
    "aiofiles>=23.1.0",
    "websockets>=11.0.2",
    "fuzzywuzzy>=0.18.0",
    "python-levenshtein>=0.21.0",
    "thefuzz>=0.19.0",
    "spacy>=3.5.1",
    "celery[redis]>=5.3.6",
    "redis>=4.6.0",
    "unstructured>=0.15.1",
    "slowapi>=0.1.8",
    "aiohttp>=3.8.6",
    "litellm>=1.0.0",
    "pydantic==2.8.0",
    "ipdb>=0.13.13",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1.tar.gz",
    "html5lib>=1.1",
    "plotly>=5.18.0",
    "pylint>=3.0.3",
    "django>=5.0.2",
    "djangorestframework>=3.14.0",
    "psycopg2-binary>=2.9.9",
    "django-cors-headers>=4.3.1",
    "bandit>=1.7.7",
    "gunicorn==22.0.0",
    "sunpy>=7.0.0",
    "reproject>=0.12.0",
    "mpl-animators>=1.2.0",
    "bs4>=0.0.2",
    "lxml>=5.1.0",
    "requests>=2.31.0",
    "drms>=0.7.1",
    "tabulate>=0.9.0",
    "djangorestframework-simplejwt>=5.3.1",
    "django-extensions>=3.2.3",
    "channels-redis>=4.2.0",
    "flower>=2.0.1",
    "pygithub>=2.3.0",
    "pdfminer-six>=20240706",
    "gitpython>=3.1.43",
    "cdasws>=1.8.7",
    "pgvector>=0.3.6",
    "django-redis>=5.4.0",
    "boto3>=1.37.33",
    "django-storages[s3]>=1.14.4",
    "pydantic-settings>=2.9.1",
    "pytest-mock>=3.14.1",
    "pytest-django>=4.8.0",
    "gevent>=25.5.1",
    "psycogreen>=1.0.2",
    "hdpws (>=0.6.26,<0.7.0)",
    "zeep>=4.2.1",
]

[project.optional-dependencies]
experiments = [
    "streamlit>=1.51.0",
    "seaborn>=0.13.2",
    "matplotlib>=3.10.3",
    "pyyaml>=6.0",
    "selenium>=4.18.1",
]
bibcollect = [
    "requests>=2.31.0",
    "python-dotenv>=0.21.1",
    "pyyaml>=6.0",
    "tqdm>=4.64.1",
    "playwright>=1.40.0",
    "boto3>=1.37.0",
]
classify = [
    "scikit-learn>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "api"]
DJANGO_SETTINGS_MODULE = "paper_analyzer_app.settings_test"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.setuptools.packages.find]
include = ["paper_data_linking*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
