# Self-consistency experiment for instrument_validation on test_set_2025_11_26

experiment_name: instrument_validation_test_set_2025_11_26
description: "Instrument validation self-consistency on validated test set"

models:
  - bedrock/openai.gpt-oss-120b-1:0

call_types:
  - instrument_validation

max_cases: 100
max_workers: 5
timeout_seconds: 36000
temperature: 1.0  # CRITICAL: enables randomness for self-consistency

call_type_configs:
  instrument_validation:
    prompt: paper_data_linking/linkers/general/prompts/validation/system.xml
    input: inputs/test_set/instrument_validation_test_set_2025_11_26_sampled_100_seed42.jsonl
    handler_class: InstrumentValidationHandler