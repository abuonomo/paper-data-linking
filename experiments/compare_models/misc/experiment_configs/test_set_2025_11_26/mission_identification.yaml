# Self-consistency experiment for mission_identification on test_set_2025_11_26

experiment_name: mission_identification_test_set_2025_11_26
description: "Mission identification self-consistency on validated test set"

models:
  - bedrock/openai.gpt-oss-120b-1:0

call_types:
  - mission_identification

max_cases: 100
max_workers: 5
timeout_seconds: 36000
temperature: 1.0

call_type_configs:
  mission_identification:
    prompt: paper_data_linking/linkers/general/prompts/mission_identification/system.xml
    input: inputs/test_set/mission_identification_test_set_2025_11_26_sampled_100_seed42.jsonl
    handler_class: MissionIdentificationHandler