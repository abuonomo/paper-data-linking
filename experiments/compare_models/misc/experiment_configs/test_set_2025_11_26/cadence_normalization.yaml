# Self-consistency experiment for cadence_normalization on test_set_2025_11_26

experiment_name: cadence_normalization_test_set_2025_11_26
description: "Cadence normalization self-consistency on validated test set"

models:
  - bedrock/openai.gpt-oss-120b-1:0

call_types:
  - cadence_normalization

max_cases: 100
max_workers: 5
timeout_seconds: 36000
temperature: 1.0

call_type_configs:
  cadence_normalization:
    prompt: paper_data_linking/linkers/general/prompts/cadence_normalization/system.xml
    input: inputs/test_set/cadence_normalization_test_set_2025_11_26_sampled_100_seed42.jsonl
    handler_class: CadenceNormalizationHandler