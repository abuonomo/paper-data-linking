# Self-consistency experiment for time_normalization on test_set_2025_11_26

experiment_name: time_normalization_test_set_2025_11_26
description: "Time normalization self-consistency on validated test set"

models:
  - bedrock/openai.gpt-oss-120b-1:0

call_types:
  - time_normalization

max_cases: 100
max_workers: 5
timeout_seconds: 36000
temperature: 1.0

call_type_configs:
  time_normalization:
    prompt: paper_data_linking/linkers/general/prompts/time_normalization/system.xml
    input: inputs/test_set/time_normalization_test_set_2025_11_26_sampled_100_seed42.jsonl
    handler_class: TimeNormalizationHandler