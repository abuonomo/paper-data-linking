# Self-consistency experiment for cadence_normalization with Bedrock 120B

experiment_name: bedrock_120b_cadence_free_text_full
description: "Cadence normalization free-text test with Bedrock 120B (100 cases)"

models:
  - bedrock/openai.gpt-oss-120b-1:0

call_types:
  - cadence_normalization

max_cases: 100
max_workers: 5
timeout_seconds: 36000
output_dir: experiments/compare_models/prompt_experiments

call_type_configs:
  cadence_normalization:
    prompt: paper_data_linking/linkers/general/prompts/cadence_normalization/system.xml
    input: inputs/test_set/cadence_normalization.jsonl
    handler_class: CadenceNormalizationFreeTextHandler
