# Test mission_selection with just 10 cases

experiment_name: bedrock_120b_mission_selection_test
description: "Mission selection test with Bedrock 120B (10 cases only)"

models:
  - bedrock/openai.gpt-oss-120b-1:0

call_types:
  - mission_selection

max_cases: 10
max_workers: 5
timeout_seconds: 1200
output_dir: experiments/compare_models/prompt_experiments

call_type_configs:
  mission_selection:
    prompt: paper_data_linking/linkers/general/prompts/mission_selection/system.xml
    input: inputs/test_set/mission_selection.jsonl
    handler_class: MissionSelectionHandler
