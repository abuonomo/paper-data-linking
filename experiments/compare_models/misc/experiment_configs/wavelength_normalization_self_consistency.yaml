# Self-consistency experiment for wavelength_normalization with Bedrock 120B

experiment_name: bedrock_120b_wavelength_norm_run
description: "Wavelength normalization self-consistency test with Bedrock 120B (100 cases, 5 runs)"

models:
  - bedrock/openai.gpt-oss-120b-1:0

call_types:
  - wavelength_normalization

max_cases: 100
max_workers: 5
timeout_seconds: 36000
output_dir: experiments/compare_models/prompt_experiments
temperature: 1.0

call_type_configs:
  wavelength_normalization:
    prompt: paper_data_linking/linkers/general/prompts/wavelength_normalization/system.xml
    input: inputs/test_set/wavelength_normalization.jsonl
    handler_class: WavelengthNormalizationHandler
