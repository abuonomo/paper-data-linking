# Self-consistency experiment for mission_selection with Bedrock 120B

experiment_name: bedrock_120b_mission_selection_full
description: "Mission selection test with Bedrock 120B (100 cases)"

models:
  - bedrock/openai.gpt-oss-120b-1:0

call_types:
  - mission_selection

max_cases: 100
max_workers: 5
timeout_seconds: 36000
output_dir: experiments/compare_models/prompt_experiments

call_type_configs:
  mission_selection:
    prompt: paper_data_linking/linkers/general/prompts/mission_selection/system.xml
    input: inputs/test_set/mission_selection.jsonl
    handler_class: MissionSelectionHandler
